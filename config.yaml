# Market
coin: solana
duration_minutes: 15

# Global
mode: simulate                    # simulate | paper | live

market_bias:
  # off | ref | rolling | ema
  mode: rolling
  # ref mode
  reference_price: null          # float, e.g. 107.0
  ref_set_timestamp: null        # unix int when ref was set; optional
  max_ref_age_windows: 250
  # rolling mode (default)
  lookback_windows: 96           # 1 day of 15m bars
  # ema mode
  ema_period: 96
  ema_band: 0.75
  # shared
  strong_move: 1.5

# Strategies
strategies:
  dual_hedge:
    enabled: false
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30
    min_streak: 3
    max_streak: 3
    max_last_delta: 0.08
    use_total_move: true
    min_total_move: 0.15
    max_total_move: 0.35
    use_reset_streak: true
    early_inference_threshold: 0.90
    decision_remaining_seconds: 60
    skip_in_flat: true
    flat_short_lookback: 20
    flat_short_max: 0.30
    # trades → {coin}-{duration}-trades.csv

  opposite_side:
    enabled: false
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30
    min_streak: 3
    max_streak: 4
    max_last_delta: 0.08
    use_total_move: true
    min_total_move: 0.20
    max_total_move: 0.50
    use_reset_streak: true
    early_inference_threshold: 0.90
    decision_remaining_seconds: 60
    skip_buy_up_when_bearish: false
    skip_buy_down_when_bullish: false
    # trades → {coin}-{duration}-opposite-trades.csv

  flat_dual:
    enabled: true
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30                # per-side price; a side already below this is bought at its ask
    max_move: 0.10                 # max |price - price_to_beat| at the decision point
    max_binance_move: 0.10         # max |binance - price_to_beat| at the decision point; ignored (pm_only) if no Binance price
    decision_fraction: 0.33334     # decide once this share of the window has elapsed (10:00 left on 15m)
    early_check_fractions: [0.25, 0.5]  # log-only: Up/Down prices and gaps at these shares of the window (11:15 and 7:30 left on 15m)
    decision_tolerance_seconds: 60 # give up if no price/asks within this long after the decision point
    cancel_remaining_seconds: 0    # cancel unfilled limits with this many seconds left; 0 = never
    cancel_move: 0.10              # after entry, if no side has filled, cancel both limits once the PM or Binance gap exceeds this; 0 = never
    # trades → {coin}-{duration}-flat-dual-trades.csv
