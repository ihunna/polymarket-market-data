# Market
coin: solana
duration_minutes: 15

# Global
mode: simulate                    # simulate | paper | live

market_bias:
  # off | ref | rolling | ema | daily_open
  mode: daily_open
  # ref mode
  reference_price: null          # float, e.g. 107.0
  ref_set_timestamp: null        # unix int when ref was set; optional
  max_ref_age_windows: 250
  # rolling mode (default)
  lookback_windows: 96           # 1 day of 15m bars
  # ema mode
  ema_period: 96
  ema_band: 0.75
  # daily_open mode: trend = price now minus the price at this UTC hour today (0 = daily candle open, 13.5 = US stock open)
  anchor_hour_utc: 0
  # shared
  strong_move: 1.5

# Strategies
strategies:
  dual_hedge:
    enabled: false
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30
    min_streak: 3
    max_streak: 3
    max_last_delta: 0.08
    use_total_move: true
    min_total_move: 0.15
    max_total_move: 0.35
    use_reset_streak: true
    early_inference_threshold: 0.90
    decision_remaining_seconds: 60
    skip_in_flat: true
    flat_short_lookback: 20
    flat_short_max: 0.30
    # trades → {coin}-{duration}-trades.csv

  opposite_side:
    enabled: false
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30
    min_streak: 3
    max_streak: 4
    max_last_delta: 0.08
    use_total_move: true
    min_total_move: 0.20
    max_total_move: 0.50
    use_reset_streak: true
    early_inference_threshold: 0.90
    decision_remaining_seconds: 60
    skip_buy_up_when_bearish: false
    skip_buy_down_when_bullish: false
    # trades → {coin}-{duration}-opposite-trades.csv

  flat_dual:
    enabled: true
    capital: 100.0
    investable_per_trade: 5.0
    capital_mode: locked
    limit_cents: 30                # per-side price; a side already below this is bought at its ask
    max_move: 0.15               # max |price - price_to_beat| at the decision point
    max_binance_move: 0.15       # max |binance - price_to_beat| at the decision point; ignored (pm_only) if no Binance price
    decision_fraction: 0.33334     # decide once this share of the window has elapsed (10:00 left on 15m)
    # log-only: Up/Down prices and gaps at these shares of the window; every minute from 14:00 to 01:00 left on 15m
    early_check_fractions: [0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333]
    flip_margin: 0.02              # log-only: the gap must cross to beyond ±this for a flip to count
    trend_skip_one_window: 0       # skip if price at the decision is this far from the previous window's open; 0 = off
    trend_skip_three_windows: 0    # skip if price at the decision is this far from the open 3 windows back; 0 = off
    calm_skip_pct: 0.5             # skip unless price stayed within ±this % of the open N windows back during those N windows; 0 = off
    calm_skip_windows: 3
    min_trades_before_decision: 0    # skip if fewer than this many trades in the window before the decision; 0 = off (still logged)
    min_volume_before_decision_usd: 0   # skip if less than this many $ traded in the window before the decision; 0 = off (still logged)
    skip_new_york_hours: ""             # dual: skip if the decision point is in this New York clock range ("12:00-05:00" = trade 10am-5pm UTC+1); "" = off. Off while the dual is log-only so ds sees every window's real skip reason
    dual_new_york_hours: "00:00-00:00"  # dual only for windows starting in this New York range; "00:00-00:00" = never (dual log-only, delta side unaffected); "" = off
    dual_weekdays_only: true            # no dual on Sat/Sun (New York date); delta side still trades
    decision_tolerance_seconds: 60 # give up if no price/asks within this long after the decision point
    cancel_remaining_seconds: 0    # cancel unfilled limits with this many seconds left; 0 = never
    cancel_move: 0                 # after entry, if no side has filled, cancel both limits once the PM or Binance gap exceeds this; 0 = never
    stop_sell_cents: 12            # with only one side filled, sell it once its bid is at or below this and cancel the other limit; 0 = never
    stop_sell_confirm_seconds: 60  # the bid must stay at or below the stop this long before selling (ignores brief dips); 0 = sell on first touch
    stop_sell_below_entry_cents: 5 # only sell if the bid is at least this far below what that side cost
    taker_fee_rate: 0.07           # Polymarket crypto taker fee: shares x rate x p x (1 - p); charged on cheap buys at the ask and on stop sells
    min_entry_ask_cents: 20        # skip the window if either side's ask is below this at the decision; 0 = off
    daily_profit_stop_usd: 10      # once the day's realised profit (dual + delta side) reaches this, no new trades until tomorrow; 0 = off
    # trades → {coin}-{duration}-flat-dual-trades.csv, delta-side trades → {coin}-{duration}-delta-side-trades.csv

    # Delta side (ds): buy the side the price is running toward, in windows the dual skips.
    # Uses this strategy's price feed and decision point (10:00 left); own settings, balance and log.
    delta_side:
      enabled: true
      # when
      skip_new_york_hours: ""      # skip if the decision point is in this New York clock range; "" = every hour (trial); "12:00-05:00" = 10am-5pm UTC+1
      all_windows: true            # also windows the dual would have entered (skip reason dual_slot); false = only moved / not_calm / trend / too_cheap skips. Replay 10-5: -56.66 on 103 tr
      recheck_until_seconds: 360   # filters fail at 10:00 left: keep checking every tick until this many seconds left; 0 = 10:00 only
      # entry
      min_gap: 0.12                # |PM gap| at least this and pointing to the favourite
      max_entry_cents: 90          # don't buy the favourite above this
      # exit
      take_profit_cents: 99        # resting sell (no fee), fills when our bid (1 - other side's ask) reaches this; 0 = hold to the end
      stop_mode: planned           # planned = stop at entry - (take_profit - entry); fixed = stop_cents
      stop_cents: 30               # fixed mode only
      stop_floor_cents: 50         # planned mode: the stop is never set below this
      stop_wait_seconds: 120       # once the bid touches the stop, sell only if it's still at/below it this long after (bounces in between don't reset it)
      # size
      contracts: 8
      capital: 100.0               # running balance; on restart: --ds-last, else last row of its log, else this
