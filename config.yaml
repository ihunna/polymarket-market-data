# Market
coin: solana
duration_minutes: 15

# ======================
# Capital & Risk
# ======================
total_capital: 100.0              # Overall account size
investable_per_trade: 10.0        # Maximum $ allocated to any single setup
capital_mode: locked              # locked | unlocked
position_sizing: fixed            # fixed (uses investable_per_trade)

# ======================
# Strategy
# ======================
limit_cents: 30                   # 40, 30, or 25
min_streak: 3
max_streak: 4
max_last_delta: 0.15
use_total_move: true              # false = ignore min/max_total_move filter
min_total_move: 0.20
max_total_move: 0.80

# Order / Simulation
mode: simulate                    # simulate | paper | live

# ======================
# Timing
# ======================
early_inference_threshold: 0.90
decision_remaining_seconds: 120
early_decision_remaining: 180     # start watching for early inference at 3 min
# Paths are derived as {coin}-{duration_minutes}-updown.csv / -trades.csv
